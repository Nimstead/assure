# Base images and actions are pinned by digest/SHA (DECISIONS 31-32); this proposes the bumps as PRs so pins don't go stale.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
