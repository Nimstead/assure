name: OSV oracle
# Our matcher and the engine against OSV's own live answers (tests/fetch_fixtures.py, tests/test_match.py). Parity with
# rescan can't catch a fault the two share; this can. A failure means OSV's answer and ours now differ: GitHub emails the
# owner. The refreshed fixtures stay in the runner; nothing is committed (DECISIONS 124).
on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      # actions pinned to commit SHAs, as in ci.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run python tests/fetch_fixtures.py
      - run: git diff --stat tests/fixtures  # what OSV changed since the committed snapshot, for whoever reads a failure
      - run: uv run pytest -q tests/test_match.py
