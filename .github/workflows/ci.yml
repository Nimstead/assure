name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read  # nothing here writes to the repository

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        db: [sqlite, postgres]
    defaults:
      run:
        working-directory: api
    env:
      # 127.0.0.1, not localhost: ::1 is tried first and Docker's IPv6 proxy can accept and never forward
      PYTHONUNBUFFERED: "1"
      NIMSTEAD_TEST_PG_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://nimstead:ci@127.0.0.1:5432/postgres' || '' }}
    steps:
      # actions pinned to commit SHAs (Dependabot proposes bumps), as in release.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # same settings as sandbox/pg.py (each test gets its own database and pool); same image digest as compose.yaml
      - name: Start PostgreSQL 17
        if: matrix.db == 'postgres'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=nimstead -e POSTGRES_PASSWORD=ci postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f -c max_connections=500
          until docker exec pg pg_isready -h 127.0.0.1 -U nimstead; do sleep 1; done  # TCP: not the init-time socket server
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check src tests ../agent ../sandbox ../scripts
        if: matrix.db == 'sqlite'
      - run: uv run python ../scripts/check_docs.py
        if: matrix.db == 'sqlite'
      # the API reference docs.nimstead.systems publishes is generated from the code: fail if it's stale
      - run: uv run python ../scripts/export_api_docs.py --check
        if: matrix.db == 'sqlite'
      - run: uv run pytest -q --durations=10 -o faulthandler_timeout=120  # a hung test dumps every thread's stack

  audit:
    # known vulnerabilities in what Nimstead ships: the locked Python dependencies and the web build's npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - run: uv export --locked --no-dev --no-emit-project --format requirements.txt > ../requirements.txt
        working-directory: api
      - run: uvx pip-audit==2.10.1 --strict --disable-pip --no-deps -r requirements.txt
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - run: docker compose config --quiet && docker build -t nimstead/assure:ci .

  windows-runtime:
    # The agent on the exact embeddable Python it ships with (plan decision 9): PSF signature valid, every module the
    # agent imports present, and a real Windows inventory collected.
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Pinned runtime, hash-checked
        run: python -I scripts/fetch_runtimes.py rt
      - name: Agent runs on it
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive rt\python-embed-amd64.zip rt\amd64
          $s = Get-AuthenticodeSignature rt\amd64\python.exe
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch '^CN=Python Software Foundation,') { throw "bad signature: $($s.Status)" }
          $inv = & rt\amd64\python.exe -I agent\nimstead_agent.py collect | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $inv.facts) { throw "collect failed" }
          "$($inv.os_name): $($inv.packages.Count) packages"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - run: uv python install 3.14 && uv sync --locked
        working-directory: api
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
