name: Release
# Signs a release (DECISIONS 31). The private key is a secret of the protected `release` environment, which waits for the
# owner's approval; it never reaches a server. Agents and deploy/update.sh accept only manifests signed by a pinned key.
# Actions are pinned to commit SHAs, and the signing step runs in an interpreter with nothing installed but
# `cryptography`, so a moved tag or a compromised API dependency never runs code next to the key.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # create the GitHub release
  id-token: write  # artifact attestation (for auditors; agents rely on the Ed25519 signature)
  attestations: write

jobs:
  sign:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - run: uv python install 3.14
      - name: Sign release.json
        env:
          NIMSTEAD_RELEASE_KEY: ${{ secrets.NIMSTEAD_RELEASE_KEY }}
        run: uv run --no-project --python 3.14 --with 'cryptography==50.0.2' python -I scripts/sign_release.py sign --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --out signed
      - name: Verify with the agent's own verifier and pinned keys
        run: python3 -I agent/nimstead_agent.py verify-release signed/release.json signed/release.json.sig
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: "signed/release.json, agent/nimstead_agent.py"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp agent/nimstead_agent.py signed/
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" signed/release.json signed/release.json.sig signed/nimstead_agent.py --clobber
