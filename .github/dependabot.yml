# Base images and actions are pinned by digest/SHA (DECISIONS 31-32), dependencies by lockfile; this proposes the bumps as PRs.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # application dependencies too: the CI audit job fails on a known vulnerability, these propose the fix
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
