name: Release
# Signs a release (DECISIONS 31, 33). The private key is a secret of the protected `release` environment, which waits for the
# owner's approval and only runs for v* tags; it never reaches a server. Agents and deploy/update.sh accept only manifests
# signed by a pinned key.
# A pushed tag is signed for the preview channel. To promote it, run this workflow FROM THAT TAG (Actions -> Release ->
# Run workflow -> "Use workflow from: Tags: vX.Y.Z", or `gh workflow run release.yml --ref vX.Y.Z -f channel=beta`):
# the same commit is re-signed for beta or stable, and GitHub's pre-release/latest labels follow the signed channel.
# Actions are pinned to commit SHAs, and the signing step runs in an interpreter with nothing installed but
# `cryptography`, so a moved tag or a compromised API dependency never runs code next to the key.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel to sign this tag for"
        required: true
        type: choice
        options: [preview, beta, stable]
        default: beta

permissions:
  contents: write  # create/edit the GitHub release
  id-token: write  # artifact attestation (for auditors; agents rely on the Ed25519 signature)
  attestations: write

jobs:
  sign:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
      CHANNEL: ${{ inputs.channel || 'preview' }}
    steps:
      - name: Check the tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - name: Signing environment (cryptography and its dependencies only, each pinned by hash)
        run: |
          uv python install 3.14
          uv venv --python 3.14 "$RUNNER_TEMP/sign"
          uv pip install --python "$RUNNER_TEMP/sign/bin/python" --require-hashes --no-deps -r scripts/sign-requirements.txt
      - name: Sign release.json
        env:
          NIMSTEAD_RELEASE_KEY: ${{ secrets.NIMSTEAD_RELEASE_KEY }}
        run: >-
          "$RUNNER_TEMP/sign/bin/python" -I scripts/sign_release.py sign
          --tag "$TAG" --commit "$GITHUB_SHA" --channel "$CHANNEL" --out signed
      - name: Verify with the agent's own verifier and pinned keys
        run: python3 -I agent/nimstead_agent.py verify-release signed/release.json signed/release.json.sig
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: "signed/release.json, agent/nimstead_agent.py"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp agent/nimstead_agent.py signed/
          if [ "$CHANNEL" = stable ]; then labels="--prerelease=false --latest"; else labels="--prerelease --latest=false"; fi
          # notes for a new release: its CHANGELOG section (promotion only re-signs and keeps notes edited since)
          v="${TAG#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md | sed '/./,$!d' > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          printf '\nFull list: [CHANGELOG](https://github.com/%s/blob/%s/CHANGELOG.md).\n' "$GITHUB_REPOSITORY" "$TAG" >> notes.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Nimstead Assure $v" --notes-file notes.md --prerelease --latest=false
          gh release upload "$TAG" signed/release.json signed/release.json.sig signed/nimstead_agent.py --clobber
          gh release edit "$TAG" $labels
          echo "$TAG signed for the $CHANNEL channel"

  sbom:
    # Nimstead's own SBOMs (CycloneDX), in a job that never sees the signing key: upload them to an application asset
    # in Assure to scan Assure itself.
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
      - name: Generate
        run: |
          (cd api && uv export --locked --no-dev --format cyclonedx1.5 --preview-features sbom-export > ../nimstead-api.cdx.json)
          (cd web && npm sbom --package-lock-only --omit=dev --sbom-format cyclonedx > ../nimstead-web.cdx.json)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" nimstead-api.cdx.json nimstead-web.cdx.json --clobber
