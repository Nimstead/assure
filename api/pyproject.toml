[project]
name = "nimstead"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ciaran W", email = "ciaranwhiteside@protonmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "cvss>=3.6",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "packaging>=26.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
nimstead = "nimstead:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "S310", "E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
