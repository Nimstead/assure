name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        db: [sqlite, postgres]
    defaults:
      run:
        working-directory: api
    env:
      NIMSTEAD_TEST_PG_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://nimstead:ci@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@v4
      # each test gets its own database and pool: the default 100 connections run out (as sandbox/pg.py sets)
      - name: Start PostgreSQL 17
        if: matrix.db == 'postgres'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=nimstead -e POSTGRES_PASSWORD=ci postgres:17 -c max_connections=500
          until docker exec pg pg_isready -h 127.0.0.1 -U nimstead; do sleep 1; done  # TCP: not the init-time socket server
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check src tests ../agent ../sandbox
        if: matrix.db == 'sqlite'
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.14 && uv sync --locked
        working-directory: api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: web
      - run: npx playwright install --with-deps chromium && npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
