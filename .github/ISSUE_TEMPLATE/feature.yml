name: Feature
description: Propose a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what can't they do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: proof
    attributes:
      label: How we'd prove it works
